receivers:
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      memory:
      load:
      filesystem:
      network:
      process:
      paging:

  # GPU metrics via DCGM Exporter (http://dcgm-exporter:9400/metrics)
  prometheus:
    config:
      scrape_configs:
        - job_name: "dcgm"
          scrape_interval: 10s
          static_configs:
            - targets: ["dcgm-exporter:9400"]

processors:
  batch:

exporters:
  otlp:
    endpoint: "otel-gateway:4317"
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, prometheus]
      processors: [batch]
      exporters: [otlp]
